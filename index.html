<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#080808">
<title>محمود الصطوف - Bus Simulator V6</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
  touch-action:none;
  overscroll-behavior:none;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
}

#startScreen{
  position:absolute;
  inset:0;
  z-index:50;
  background:
    radial-gradient(circle at center,#27364a 0%,#101722 40%,#030405 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
}

.startBox{
  width:min(90%,430px);
  padding:28px 20px;
  border-radius:28px;
  background:rgba(0,0,0,.65);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 20px 80px #000;
  backdrop-filter:blur(10px);
}

.logo{
  width:100px;
  height:100px;
  margin:auto;
  border-radius:25px;
  border:3px solid #e0b83f;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:52px;
  font-weight:900;
  color:#e0b83f;
  box-shadow:0 0 35px rgba(224,184,63,.25);
}

h1{
  margin:18px 0 6px;
  font-size:28px;
}

.subtitle{
  color:#bbb;
  margin-bottom:25px;
}

.startBtn{
  width:100%;
  border:0;
  border-radius:18px;
  padding:17px;
  font-size:19px;
  font-weight:bold;
  color:#111;
  background:linear-gradient(135deg,#ffe38a,#c99b25);
}

#hud{
  position:absolute;
  top:max(12px,env(safe-area-inset-top));
  left:12px;
  right:12px;
  z-index:10;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  pointer-events:none;
}

.hudBox{
  min-width:100px;
  padding:9px 12px;
  border-radius:15px;
  color:white;
  background:rgba(0,0,0,.58);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(7px);
  text-align:center;
  font-size:13px;
}

.hudBox strong{
  display:block;
  color:#ffd75c;
  font-size:19px;
  margin-top:3px;
}

#mission{
  position:absolute;
  top:100px;
  left:50%;
  transform:translateX(-50%);
  width:min(80%,400px);
  z-index:10;
  pointer-events:none;
}

.missionBar{
  height:9px;
  overflow:hidden;
  background:rgba(0,0,0,.5);
  border-radius:20px;
  border:1px solid rgba(255,255,255,.15);
}

#missionFill{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#ffd54a,#fff0a0);
}

#missionText{
  margin-top:6px;
  text-align:center;
  color:white;
  font-size:12px;
  text-shadow:0 2px 4px #000;
}

/* CONTROLS */

#controls{
  position:absolute;
  inset:0;
  z-index:20;
  pointer-events:none;
}

.control{
  pointer-events:auto;
  touch-action:none;
  -webkit-touch-callout:none;
}

#steeringArea{
  position:absolute;
  left:15px;
  bottom:calc(18px + env(safe-area-inset-bottom));
  width:145px;
  height:145px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.38);
  border:3px solid rgba(255,255,255,.16);
}

#steering{
  width:116px;
  height:116px;
  border-radius:50%;
  border:10px solid #222;
  position:relative;
  background:radial-gradient(circle,#333 0 17%,#111 18% 100%);
  box-shadow:0 7px 20px #000;
  transform:rotate(0deg);
  transition:transform .04s linear;
}

#steering:before,
#steering:after{
  content:"";
  position:absolute;
  background:#555;
  border-radius:10px;
}

#steering:before{
  width:10px;
  height:75px;
  left:43px;
  top:10px;
}

#steering:after{
  width:75px;
  height:10px;
  left:10px;
  top:43px;
}

#pedals{
  position:absolute;
  right:15px;
  bottom:calc(18px + env(safe-area-inset-bottom));
  display:flex;
  gap:12px;
  align-items:flex-end;
}

.pedal{
  width:72px;
  height:108px;
  border:0;
  border-radius:22px;
  color:white;
  font-weight:bold;
  font-size:15px;
  box-shadow:0 7px 18px #000;
  border:2px solid rgba(255,255,255,.15);
}

#gas{
  background:linear-gradient(#20a954,#08742f);
}

#brake{
  background:linear-gradient(#e34242,#861c1c);
}

#reverse{
  position:absolute;
  right:100px;
  bottom:calc(135px + env(safe-area-inset-bottom));
  width:68px;
  height:55px;
  border:0;
  border-radius:17px;
  background:rgba(20,20,20,.85);
  color:white;
  font-size:14px;
  font-weight:bold;
  border:1px solid rgba(255,255,255,.18);
}

#actions{
  position:absolute;
  top:145px;
  right:15px;
  display:grid;
  grid-template-columns:repeat(2,58px);
  gap:9px;
}

.action{
  width:58px;
  height:58px;
  border:0;
  border-radius:17px;
  background:rgba(0,0,0,.62);
  color:white;
  font-size:23px;
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 5px 14px #000;
}

.action small{
  display:block;
  font-size:9px;
  margin-top:2px;
}

/* speed */

#speedometer{
  position:absolute;
  bottom:calc(25px + env(safe-area-inset-bottom));
  left:50%;
  transform:translateX(-50%);
  width:115px;
  height:65px;
  border-radius:70px 70px 15px 15px;
  background:rgba(0,0,0,.68);
  border:2px solid rgba(255,255,255,.12);
  color:white;
  text-align:center;
  padding-top:12px;
  pointer-events:none;
}

#speedValue{
  font-size:25px;
  font-weight:bold;
  color:#ffd65a;
}

#speedUnit{
  font-size:10px;
  color:#aaa;
}

#doorStatus{
  position:absolute;
  top:210px;
  left:50%;
  transform:translateX(-50%);
  color:#ffd65a;
  background:rgba(0,0,0,.6);
  border-radius:15px;
  padding:7px 14px;
  font-size:12px;
  opacity:0;
  transition:.2s;
}

/* message */

#message{
  position:absolute;
  left:50%;
  top:52%;
  transform:translate(-50%,-50%);
  z-index:40;
  color:white;
  background:rgba(0,0,0,.82);
  padding:18px 25px;
  border-radius:20px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
  display:none;
  border:1px solid rgba(255,255,255,.15);
}

@media(max-height:650px){
  #steeringArea{
    width:120px;
    height:120px;
  }

  #steering{
    width:96px;
    height:96px;
  }

  #steering:before{
    left:36px;
    height:60px;
  }

  #steering:after{
    left:9px;
    top:36px;
    width:60px;
  }

  .pedal{
    height:85px;
    width:64px;
  }

  #actions{
    top:120px;
  }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="startScreen">
  <div class="startBox">
    <div class="logo">م</div>
    <h1>محمود الصطوف</h1>
    <div class="subtitle">BUS SIMULATOR V6</div>
    <button class="startBtn" id="startBtn">ابدأ القيادة 🚌</button>
  </div>
</div>

<div id="hud">
  <div class="hudBox">
    المرحلة
    <strong id="stage">1</strong>
  </div>

  <div class="hudBox">
    الوقود
    <strong id="fuel">100%</strong>
  </div>

  <div class="hudBox">
    المال
    <strong id="money">0₺</strong>
  </div>
</div>

<div id="mission">
  <div class="missionBar">
    <div id="missionFill"></div>
  </div>
  <div id="missionText">الوصول إلى المحطة</div>
</div>

<div id="doorStatus">الأبواب مغلقة</div>

<div id="speedometer">
  <div id="speedValue">0</div>
  <div id="speedUnit">كم/س</div>
</div>

<div id="controls">

  <!-- STEERING -->
  <div id="steeringArea" class="control">
    <div id="steering"></div>
  </div>

  <!-- PEDALS -->
  <div id="pedals">

    <button id="brake"
            class="pedal control">
      فرامل
    </button>

    <button id="gas"
            class="pedal control">
      بنزين
    </button>

  </div>

  <button id="reverse" class="control">
    R<br>رجوع
  </button>

  <!-- ACTIONS -->
  <div id="actions">

    <button id="horn"
            class="action control">
      📯
      <small>بوري</small>
    </button>

    <button id="lights"
            class="action control">
      💡
      <small>أضواء</small>
    </button>

    <button id="door"
            class="action control">
      🚪
      <small>باب</small>
    </button>

    <button id="cameraBtn"
            class="action control">
      🎥
      <small>كاميرا</small>
    </button>

  </div>

</div>

<div id="message"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   محمود الصطوف BUS SIMULATOR V6
   MOBILE TOUCH CONTROL SYSTEM
========================================================= */

const canvas = document.getElementById("canvas");

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x9ec9ee);

scene.fog = new THREE.Fog(
  0x9ec9ee,
  90,
  500
);

const camera = new THREE.PerspectiveCamera(
  65,
  innerWidth / innerHeight,
  .1,
  1000
);

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias:false,
  powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.3));

/* LIGHT */

const hemi = new THREE.HemisphereLight(
  0xffffff,
  0x556644,
  1.8
);

scene.add(hemi);

const sun = new THREE.DirectionalLight(
  0xffffff,
  1.4
);

sun.position.set(
  -50,
  100,
  50
);

scene.add(sun);

/* WORLD */

const road = new THREE.Mesh(
  new THREE.BoxGeometry(22,.15,1800),
  new THREE.MeshStandardMaterial({
    color:0x303030,
    roughness:1
  })
);

road.position.y=-.08;
road.position.z=-750;

scene.add(road);

/* GRASS */

const grassMat = new THREE.MeshStandardMaterial({
  color:0x397a35
});

const grass1 = new THREE.Mesh(
  new THREE.BoxGeometry(100,.1,1800),
  grassMat
);

grass1.position.set(-61,-.15,-750);

scene.add(grass1);

const grass2 = grass1.clone();

grass2.position.x=61;

scene.add(grass2);

/* SIDEWALKS */

function createSidewalk(x){

  const s = new THREE.Mesh(
    new THREE.BoxGeometry(3,.35,1800),
    new THREE.MeshStandardMaterial({
      color:0x858585
    })
  );

  s.position.set(x,.05,-750);

  scene.add(s);
}

createSidewalk(-14);
createSidewalk(14);

/* ROAD LINES */

const lineMat = new THREE.MeshBasicMaterial({
  color:0xffffff
});

for(let z=20;z>-1800;z-=15){

  const line = new THREE.Mesh(
    new THREE.BoxGeometry(.35,.03,7),
    lineMat
  );

  line.position.set(0,.02,z);

  scene.add(line);
}

/* ROAD EDGE LINES */

const edgeMat = new THREE.MeshBasicMaterial({
  color:0xffd44d
});

for(const x of [-10.5,10.5]){

  const edge = new THREE.Mesh(
    new THREE.BoxGeometry(.22,.04,1800),
    edgeMat
  );

  edge.position.set(x,.03,-750);

  scene.add(edge);
}

/* BUILDINGS */

function building(x,z){

  const h = 7 + Math.random()*15;
  const w = 6 + Math.random()*8;

  const b = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,8),
    new THREE.MeshStandardMaterial({
      color:new THREE.Color().setHSL(
        Math.random(),
        .25,
        .42
      )
    })
  );

  b.position.set(
    x,
    h/2,
    z
  );

  scene.add(b);

  /* windows */

  for(let yy=2;yy<h-1;yy+=2.5){

    const win = new THREE.Mesh(
      new THREE.BoxGeometry(
        w*.08,
        .6,
        1
      ),
      new THREE.MeshBasicMaterial({
        color:0xffd66b
      })
    );

    win.position.set(
      x,
      yy,
      z-4.05
    );

    scene.add(win);
  }
}

for(let z=0;z>-1750;z-=35){

  building(-24,z);
  building(24,z-15);
}

/* TREES */

function tree(x,z){

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(
      .25,.35,2.2,7
    ),
    new THREE.MeshStandardMaterial({
      color:0x704225
    })
  );

  trunk.position.set(x,1.1,z);

  scene.add(trunk);

  const crown = new THREE.Mesh(
    new THREE.SphereGeometry(
      1.6,8,8
    ),
    new THREE.MeshStandardMaterial({
      color:0x267a35
    })
  );

  crown.position.set(x,3,z);

  scene.add(crown);
}

for(let z=0;z>-1750;z-=28){

  tree(-18,z-8);
  tree(18,z-20);
}

/* BUS */

const bus = new THREE.Group();

scene.add(bus);

const bodyMat = new THREE.MeshStandardMaterial({
  color:0xb21e27,
  roughness:.65
});

const darkMat = new THREE.MeshStandardMaterial({
  color:0x15191d
});

const goldMat = new THREE.MeshStandardMaterial({
  color:0xe0b83f,
  metalness:.4,
  roughness:.35
});

const body = new THREE.Mesh(
  new THREE.BoxGeometry(3.5,3.3,9),
  bodyMat
);

body.position.y=2.05;

bus.add(body);

/* lower body */

const lower = new THREE.Mesh(
  new THREE.BoxGeometry(3.65,.8,9.1),
  darkMat
);

lower.position.y=.75;

bus.add(lower);

/* roof */

const roof = new THREE.Mesh(
  new THREE.BoxGeometry(3.35,.3,8.8),
  darkMat
);

roof.position.y=3.75;

bus.add(roof);

/* gold stripe */

const stripe = new THREE.Mesh(
  new THREE.BoxGeometry(
    3.58,.32,8.8
  ),
  goldMat
);

stripe.position.y=2.3;

bus.add(stripe);

/* WINDOWS */

for(const z of [-2.8,-.8,1.2,3.0]){

  const w = new THREE.Mesh(
    new THREE.BoxGeometry(
      3.05,1.05,1.35
    ),
    new THREE.MeshStandardMaterial({
      color:0x172a38,
      metalness:.15,
      roughness:.2
    })
  );

  w.position.set(
    0,
    3.0,
    z
  );

  bus.add(w);
}

/* FRONT WINDOW */

const frontWindow = new THREE.Mesh(
  new THREE.BoxGeometry(
    3.05,1.1,.12
  ),
  darkMat
);

frontWindow.position.set(
  0,
  3.05,
  -4.55
);

bus.add(frontWindow);

/* HEADLIGHTS */

const headlights=[];

for(const x of [-1.15,1.15]){

  const h = new THREE.Mesh(
    new THREE.BoxGeometry(
      .5,.35,.15
    ),
    new THREE.MeshBasicMaterial({
      color:0xffffcc
    })
  );

  h.position.set(
    x,
    1.35,
    -4.62
  );

  bus.add(h);

  headlights.push(h);
}

/* WHEELS */

function wheel(x,z){

  const w = new THREE.Mesh(
    new THREE.CylinderGeometry(
      .65,.65,.45,16
    ),
    new THREE.MeshStandardMaterial({
      color:0x090909
    })
  );

  w.rotation.z=Math.PI/2;

  w.position.set(
    x,
    .55,
    z
  );

  bus.add(w);
}

wheel(-1.85,-2.8);
wheel(1.85,-2.8);
wheel(-1.85,2.8);
wheel(1.85,2.8);

/* MIRRORS */

for(const x of [-2.05,2.05]){

  const m = new THREE.Mesh(
    new THREE.BoxGeometry(
      .15,.7,.7
    ),
    darkMat
  );

  m.position.set(
    x,
    3.0,
    -3.8
  );

  bus.add(m);
}

bus.position.set(
  0,
  0,
  25
);

/* TRAFFIC */

const traffic=[];

function createTraffic(x,z,color){

  const car = new THREE.Mesh(
    new THREE.BoxGeometry(
      2.2,1.3,4
    ),
    new THREE.MeshStandardMaterial({
      color
    })
  );

  car.position.set(
    x,
    .7,
    z
  );

  scene.add(car);

  traffic.push({
    mesh:car,
    speed:10+Math.random()*12
  });
}

for(let i=0;i<16;i++){

  createTraffic(
    Math.random()>.5 ? -5 : 5,
    -40-i*90,
    new THREE.Color().setHSL(
      Math.random(),
      .7,
      .5
    )
  );
}

/* STATIONS */

const stations=[];

for(let i=0;i<20;i++){

  const z=-35-i*80;

  const s = new THREE.Mesh(
    new THREE.BoxGeometry(
      6,.12,5
    ),
    new THREE.MeshStandardMaterial({
      color:0xd8a92e
    })
  );

  s.position.set(
    -7,
    .08,
    z
  );

  scene.add(s);

  stations.push({
    z,
    done:false
  });
}

/* GAME STATE */

let running=false;

let speed=0;
let fuel=100;
let money=0;
let passengers=0;

let steering=0;

let gasPressed=false;
let brakePressed=false;
let reverse=false;

let doorsOpen=false;
let lightsOn=false;

let cameraMode=0;

let distance=0;

let stage=1;

const missions=[
  {distance:600,passengers:2,reward:100},
  {distance:1000,passengers:4,reward:180},
  {distance:1400,passengers:6,reward:280},
  {distance:1800,passengers:8,reward:400},
  {distance:2200,passengers:10,reward:600}
];

/* =========================================================
   MOBILE TOUCH CONTROLS
========================================================= */

const steeringArea =
  document.getElementById("steeringArea");

const steeringEl =
  document.getElementById("steering");

let steeringTouchId=null;

function updateSteering(clientX){

  const rect =
    steeringArea.getBoundingClientRect();

  const centerX =
    rect.left + rect.width/2;

  let dx =
    clientX-centerX;

  const max =
    rect.width*.42;

  dx=Math.max(-max,Math.min(max,dx));

  steering =
    dx/max;

  steeringEl.style.transform =
    `rotate(${steering*55}deg)`;
}

function resetSteering(){

  steering=0;

  steeringEl.style.transform =
    "rotate(0deg)";

  steeringTouchId=null;
}

/* TOUCH START */

steeringArea.addEventListener(
  "touchstart",
  function(e){

    e.preventDefault();

    const t=e.changedTouches[0];

    steeringTouchId=t.identifier;

    updateSteering(t.clientX);

  },
  {passive:false}
);

/* TOUCH MOVE */

steeringArea.addEventListener(
  "touchmove",
  function(e){

    e.preventDefault();

    for(const t of e.changedTouches){

      if(t.identifier===steeringTouchId){

        updateSteering(t.clientX);
      }
    }

  },
  {passive:false}
);

/* TOUCH END */

steeringArea.addEventListener(
  "touchend",
  function(e){

    e.preventDefault();

    for(const t of e.changedTouches){

      if(t.identifier===steeringTouchId){

        resetSteering();
      }
    }

  },
  {passive:false}
);

steeringArea.addEventListener(
  "touchcancel",
  resetSteering,
  {passive:false}
);

/* =========================================================
   PEDAL SYSTEM
========================================================= */

function holdButton(
  element,
  press,
  release
){

  element.addEventListener(
    "touchstart",
    e=>{
      e.preventDefault();
      press();
    },
    {passive:false}
  );

  element.addEventListener(
    "touchend",
    e=>{
      e.preventDefault();
      release();
    },
    {passive:false}
  );

  element.addEventListener(
    "touchcancel",
    e=>{
      e.preventDefault();
      release();
    },
    {passive:false}
  );

  /* mouse */

  element.addEventListener(
    "mousedown",
    e=>{
      e.preventDefault();
      press();
    }
  );

  element.addEventListener(
    "mouseup",
    e=>{
      e.preventDefault();
      release();
    }
  );

  element.addEventListener(
    "mouseleave",
    e=>{
      release();
    }
  );
}

holdButton(
  document.getElementById("gas"),
  ()=>{
    gasPressed=true;
  },
  ()=>{
    gasPressed=false;
  }
);

holdButton(
  document.getElementById("brake"),
  ()=>{
    brakePressed=true;
  },
  ()=>{
    brakePressed=false;
  }
);

/* REVERSE */

const reverseBtn =
  document.getElementById("reverse");

reverseBtn.addEventListener(
  "touchstart",
  e=>{
    e.preventDefault();
    reverse=true;
  },
  {passive:false}
);

reverseBtn.addEventListener(
  "touchend",
  e=>{
    e.preventDefault();
    reverse=false;
  },
  {passive:false}
);

/* =========================================================
   BUTTONS
========================================================= */

function tapButton(element,fn){

  element.addEventListener(
    "touchstart",
    e=>{
      e.preventDefault();
      fn();
    },
    {passive:false}
  );

  element.addEventListener(
    "click",
    e=>{
      fn();
    }
  );
}

/* HORN */

tapButton(
  document.getElementById("horn"),
  ()=>{
    showMessage("📯 بــــــوري!");
    setTimeout(hideMessage,700);
  }
);

/* LIGHTS */

tapButton(
  document.getElementById("lights"),
  ()=>{

    lightsOn=!lightsOn;

    headlights.forEach(h=>{
      h.material.color.set(
        lightsOn ? 0xffffff : 0x777777
      );
    });

  }
);

/* DOOR */

tapButton(
  document.getElementById("door"),
  ()=>{

    if(Math.abs(speed)>2){

      showMessage("🚌 توقف أولاً لفتح الباب");

      setTimeout(hideMessage,900);

      return;
    }

    doorsOpen=!doorsOpen;

    document.getElementById(
      "doorStatus"
    ).textContent =
      doorsOpen
      ? "🚪 الأبواب مفتوحة"
      : "🚪 الأبواب مغلقة";

    document.getElementById(
      "doorStatus"
    ).style.opacity=1;

    setTimeout(()=>{
      document.getElementById(
        "doorStatus"
      ).style.opacity=0;
    },1000);

  }
);

/* CAMERA */

tapButton(
  document.getElementById("cameraBtn"),
  ()=>{
    cameraMode++;

    if(cameraMode>2)
      cameraMode=0;
  }
);

/* =========================================================
   KEYBOARD
========================================================= */

const keys={};

window.addEventListener(
  "keydown",
  e=>{

    keys[e.code]=true;

    if(e.code==="KeyE"){
      document.getElementById("door").click();
    }

    if(e.code==="KeyL"){
      document.getElementById("lights").click();
    }

    if(e.code==="KeyH"){
      document.getElementById("horn").click();
    }

    if(e.code==="KeyC"){
      document.getElementById("cameraBtn").click();
    }

  }
);

window.addEventListener(
  "keyup",
  e=>{
    keys[e.code]=false;
  }
);

/* =========================================================
   START
========================================================= */

document.getElementById(
  "startBtn"
).addEventListener(
  "click",
  startGame
);

function startGame(){

  document.getElementById(
    "startScreen"
  ).style.display="none";

  running=true;

  showMessage(
    "🚌 انطلقت الرحلة!<br><small>استخدم عجلة القيادة والبنزين</small>"
  );

  setTimeout(
    hideMessage,
    1800
  );
}

/* MESSAGE */

function showMessage(text){

  const el=
    document.getElementById("message");

  el.innerHTML=text;

  el.style.display="block";
}

function hideMessage(){

  document.getElementById(
    "message"
  ).style.display="none";
}

/* =========================================================
   GAME PHYSICS
========================================================= */

let lastTime=performance.now();

function update(dt){

  if(!running) return;

  /* keyboard */

  const keyboardGas =
    keys["ArrowUp"] ||
    keys["KeyW"];

  const keyboardBrake =
    keys["ArrowDown"] ||
    keys["KeyS"];

  const keyboardLeft =
    keys["ArrowLeft"] ||
    keys["KeyA"];

  const keyboardRight =
    keys["ArrowRight"] ||
    keys["KeyD"];

  let gas =
    gasPressed || keyboardGas;

  let brake =
    brakePressed || keyboardBrake;

  let steer =
    steering;

  if(keyboardLeft) steer=-1;
  if(keyboardRight) steer=1;

  if(reverse || keys["KeyR"]){

    if(gas){

      speed -= 16*dt;
    }

  }else{

    if(gas){

      speed += 22*dt;
    }
  }

  if(brake){

    if(speed>0)
      speed -= 38*dt;
    else
      speed += 28*dt;
  }

  /* natural drag */

  if(!gas && !brake){

    speed *= Math.pow(.985,dt*60);
  }

  speed=
    Math.max(-18,Math.min(65,speed));

  /* steering */

  const steeringPower =
    .00085 * speed;

  bus.rotation.y -=
    steer * steeringPower * dt * 60;

  /* move bus */

  const forward =
    new THREE.Vector3(
      0,
      0,
      -1
    ).applyQuaternion(
      bus.quaternion
    );

  bus.position.addScaledVector(
    forward,
    speed*dt
  );

  /* distance */

  distance +=
    Math.abs(speed)*dt;

  /* fuel */

  fuel -=
    Math.abs(speed)*dt*.006;

  fuel=Math.max(0,fuel);

  if(fuel<=0){

    speed*=.97;

    showMessage("⛽ نفد الوقود!");
  }

  /* passengers */

  for(const s of stations){

    if(
      !s.done &&
      Math.abs(
        bus.position.z-s.z
      )<7 &&
      Math.abs(speed)<4 &&
      doorsOpen
    ){

      s.done=true;

      passengers++;

      money+=25;

      showMessage(
        "👨‍👩‍👧 ركاب جدد<br>+25₺"
      );

      setTimeout(
        hideMessage,
        1000
      );
    }
  }

  /* traffic */

  traffic.forEach(car=>{

    car.mesh.position.z +=
      car.speed*dt;

    if(
      car.mesh.position.z >
      bus.position.z+60
    ){

      car.mesh.position.z =
        bus.position.z-700;
    }

  });

  /* camera */

  updateCamera();

  /* HUD */

  document.getElementById(
    "speedValue"
  ).textContent=
    Math.round(Math.abs(speed)*3.6);

  document.getElementById(
    "fuel"
  ).textContent=
    Math.round(fuel)+"%";

  document.getElementById(
    "money"
  ).textContent=
    money+"₺";

  document.getElementById(
    "stage"
  ).textContent=
    stage;

  const mission=
    missions[stage-1];

  const progress=
    Math.min(
      100,
      distance/mission.distance*100
    );

  document.getElementById(
    "missionFill"
  ).style.width=
    progress+"%";

  document.getElementById(
    "missionText"
  ).textContent=
    `المسافة ${Math.round(distance)} / ${mission.distance} م — الركاب ${passengers}/${mission.passengers}`;

  /* mission */

  if(
    distance>=mission.distance
  ){

    finishMission();
  }
}

/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

  const target =
    bus.position.clone();

  if(cameraMode===0){

    const offset =
      new THREE.Vector3(
        0,
        7.5,
        13
      );

    offset.applyQuaternion(
      bus.quaternion
    );

    camera.position.lerp(
      bus.position.clone().add(offset),
      .08
    );

    camera.lookAt(
      target.x,
      target.y+2,
      target.z-8
    );

  }else if(cameraMode===1){

    const offset =
      new THREE.Vector3(
        0,
        3.8,
        8
      );

    offset.applyQuaternion(
      bus.quaternion
    );

    camera.position.lerp(
      bus.position.clone().add(offset),
      .1
    );

    camera.lookAt(
      target.x,
      target.y+2,
      target.z-10
    );

  }else{

    const offset =
      new THREE.Vector3(
        0,
        2.5,
        1
      );

    offset.applyQuaternion(
      bus.quaternion
    );

    camera.position.lerp(
      bus.position.clone().add(offset),
      .12
    );

    const look =
      bus.position.clone();

    look.z-=10;

    camera.lookAt(
      look
    );
  }
}

/* =========================================================
   MISSION
========================================================= */

function finishMission(){

  const mission=
    missions[stage-1];

  money+=mission.reward;

  showMessage(
    `🎉 انتهت المرحلة ${stage}!<br>
     💰 +${mission.reward}₺`
  );

  if(stage<missions.length){

    stage++;

    distance=0;
    passengers=0;

    stations.forEach(s=>{
      s.done=false;
    });

  }else{

    stage=1;
    distance=0;
    passengers=0;

    showMessage(
      "🏆 أكملت جميع المراحل!"
    );
  }
}

/* =========================================================
   ANIMATION
========================================================= */

function animate(now){

  requestAnimationFrame(
    animate
  );

  const dt =
    Math.min(
      (now-lastTime)/1000,
      .05
    );

  lastTime=now;

  update(dt);

  renderer.render(
    scene,
    camera
  );
}

animate(
  performance.now()
);

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{
    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

    renderer.setPixelRatio(
      Math.min(devicePixelRatio,1.3)
    );
  }
);

========================================================= */

document.addEventListener(

    e.preventDefault();

);

document.addEventListener(
  "gesturestart",
  e=>{
    e.preventDefault();
  },
  {passive:false}
);

document.addEventListener(
  "gesturechange",
  e=>{
    e.preventDefault();
  },
  {passive:false}
);

document.addEventListener(
  "gestureend",
  e=>{
    e.preventDefault();
  },
  {passive:false}
);

/* prevent context menu */

document.addEventListener(
  "contextmenu",
  e=>{
    e.preventDefault();
  }
);

</script>
